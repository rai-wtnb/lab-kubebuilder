# Entry point of lab-kubebuilder: installs tools (mise install) and runs tasks (mise <task>).
# https://mise.jdx.dev/
#
# First time: mise trust && mise install
# List tasks: mise tasks
#
# Tasks are run in the short form, mise <task>, without "run".
# The short form only works while the task name is not a mise command, so three
# tasks avoid the names up / install / run:
#   mise up      is mise upgrade (upgrades the tools)  -> cluster-up
#   mise install installs the tools                    -> install-crds
#   mise run     is the task runner itself             -> run-local
# The old names remain as aliases for the long form (mise run up, mise run install, mise run run).

[tools]
# Used by the Makefile and go.mod that kubebuilder generates. The scaffold uses Go 1.26+ syntax
go = "1.27.0"
# Scaffolds the project (init / create api / create webhook)
kubebuilder = "4.16.0"
kind = "0.33.0"
kubectl = "1.37.2"
# Local VM + docker runtime. Start it with: colima start kubebuilder-lab --cpu 4 --memory 8 --disk 30
# (a colima instance already started for lab-argocd etc. works as is)
colima = "0.10.3"
# docker CLI (the daemon runs inside the colima VM). Used by make docker-build and kind
docker-cli = "29.9.3"
# controller-gen / kustomize / setup-envtest / golangci-lint are not managed by mise.
# The Makefile generated by kubebuilder installs pinned versions into operator/bin/

[env]
# Under this directory, kubectl / make / kind only see the lab's own kubeconfig.
# make install and make run act on the current context, so this keeps them from
# touching any other cluster listed in ~/.kube/config
KUBECONFIG = "{{config_root}}/.work/kubeconfig"

# --- setup / teardown ---

[tasks.cluster-up]
alias = "up"
description = "Check prerequisites, then create the kind cluster kubebuilder-lab (1-2 min)"
run = [
  "./scripts/00-prereqs.sh",
  "./scripts/01-cluster.sh",
  "echo '== Done. Next: mise init to scaffold the project / see docs/01-handson.md =='",
]

[tasks.cluster-down]
alias = "down"
description = "Delete the kind cluster (the code in operator/ is kept)"
run = '''
kind delete cluster --name kubebuilder-lab || true
rm -rf .work
'''

[tasks.status]
description = "Show the cluster, this project's CRDs and the in-cluster controller"
run = "./scripts/status.sh"

# --- kubebuilder project (operator/) ---

[tasks.init]
description = "Scaffold operator/ with kubebuilder init (skipped if already scaffolded)"
run = "./scripts/init.sh"

[tasks.install-crds]
alias = "install"
description = "Install the CRDs into the cluster (make install in operator/)"
dir = "operator"
run = "make install"

[tasks.run-local]
alias = "run"
description = "Run the controller as a local process (make run; Ctrl-C to stop)"
dir = "operator"
run = "make run"

[tasks.test]
description = "Run the tests with envtest (make test)"
dir = "operator"
run = "make test"

[tasks.deploy]
description = "Build the image, load it into the kind node, and deploy it as a Deployment"
run = "./scripts/deploy.sh"

[tasks.undeploy]
description = "Remove the in-cluster controller and the CRDs (make undeploy)"
dir = "operator"
run = "make undeploy ignore-not-found=true"

[tasks.logs]
description = "Follow the logs of the in-cluster controller (Ctrl-C to stop)"
run = "./scripts/logs.sh"
